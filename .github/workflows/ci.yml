name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and run unit + integration tests
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  ml-service:
    name: ML Service (Python / FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        working-directory: ml-service
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: ml-service
        run: pytest tests/ -v

  frontend:
    name: Frontend (React / TypeScript / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: frontend
        run: npm run test

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker image build sanity check
    runs-on: ubuntu-latest
    needs: [backend, ml-service, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t erip-backend:ci ./backend

      - name: Build ML service image
        run: docker build -t erip-ml-service:ci ./ml-service

      - name: Build frontend image
        run: docker build -t erip-frontend:ci ./frontend
